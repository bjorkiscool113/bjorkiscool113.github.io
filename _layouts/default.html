<!DOCTYPE html>
<html lang="{{ page.lang | default: "en" }}">
  {%- include head.html -%}
  <body a="{{ site.theme_config.appearance | default: "auto" }}">
	  <img src="{{ '/assets/images/header.png' | relative_url }}" alt="Stamped seal with a stylized shrug emoticon in the center, surrounded by six stars and lyrics from a song: 'I don't understand, and I'll never understand, but I'll try to understand; there's nothing else I can do.' The lyrics are from Fiona Apple's song 'Red, Red, Red.' " />
	  <main class="page-content" aria-label="Content">
      <div class="w">
        {{ content }}
      </div>
    </main>

    {%-if site.goat_counter and jekyll.environment == "production"-%}
      {%-include goat_counter.html-%}
    {%-endif-%}

    {% if page.custom_js %}
      {% for js_file in page.custom_js %}
        <script type="text/javascript" src="{{ site.baseurl }}/assets/js/{{ js_file }}.js"></script>
      {% endfor %}
    {% endif %}
  </body>
</html>
